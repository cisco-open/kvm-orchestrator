# Alembic config for the kvm-orchestrator controller.
#
# All migrations live under `migrations/` in this directory. The env.py in
# that directory imports the app's config so DATABASE_URL flows through to
# Alembic without duplication.
#
# Invocation: from the /app WORKDIR inside the container image (or from
# the controller/ dir when working locally with the container Python env):
#
#   alembic upgrade head     # apply all pending revisions
#   alembic current          # show what revision we're at
#   alembic stamp <rev>      # record a revision without running it
#                            # (used after mysqldump import to align)
#   alembic history          # list all revisions
#
# On K8s the Helm job-migrate runs `alembic upgrade head` as a
# pre-install + pre-upgrade hook.

[alembic]
script_location = migrations
prepend_sys_path = .

# Naming convention for auto-generated revision files.
# Prefix + slug produces e.g. 0001_baseline_v0_17_0.py
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Truncate slug to keep filenames readable
truncate_slug_length = 40

# sqlalchemy.url is intentionally NOT set here.
# migrations/env.py reads it from DATABASE_URL (via app/config.py).

[post_write_hooks]
# Empty - we hand-write migrations, no autogenerate hooks needed

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

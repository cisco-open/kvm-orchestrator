apiVersion: v1
kind: Service
metadata:
  # Static name (not release-name prefixed) so the UI nginx config, which is
  # baked into the wvc-ui image with upstream `kvmaestro-api`, resolves
  # correctly. This mirrors the Docker Compose service name.
  name: kvmaestro-api
  labels:
    {{- include "kvmaestro.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    {{- include "kvmaestro.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

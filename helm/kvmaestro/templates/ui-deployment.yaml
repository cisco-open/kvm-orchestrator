apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvmaestro.fullname" . }}-ui
  labels:
    {{- include "kvmaestro.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.replicaCount.ui }}
  selector:
    matchLabels:
      {{- include "kvmaestro.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "kvmaestro.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.image.ui.repository }}:{{ .Values.image.ui.tag }}"
          imagePullPolicy: {{ .Values.image.ui.pullPolicy }}
          env:
            # Drives the runtime /env.js the entrypoint writes: red border +
            # "TEST ENVIRONMENT" banner when set to "test". Defaults to live.
            - name: ENVIRONMENT
              value: {{ .Values.config.ENVIRONMENT | default "live" | quote }}
            # Brand preset: "kvmaestro" (default, debranded open-source) or
            # or a custom white-label preset (see frontend/src/branding.ts).
            - name: BRANDING
              value: {{ .Values.config.BRANDING | default "kvmaestro" | quote }}
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 30

{{- if gt (int .Values.replicaCount.worker) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvm-orchestrator.fullname" . }}-worker
  labels:
    {{- include "kvm-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "kvm-orchestrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "kvm-orchestrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["celery", "-A", "celery_worker.celery", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: {{ include "kvm-orchestrator.fullname" . }}-config
            - secretRef:
                name: {{ include "kvm-orchestrator.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
{{- end }}

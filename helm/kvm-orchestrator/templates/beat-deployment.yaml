{{- if gt (int .Values.replicaCount.beat) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvm-orchestrator.fullname" . }}-beat
  labels:
    {{- include "kvm-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kvm-orchestrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "kvm-orchestrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: beat
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["celery", "-A", "celery_worker.celery", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: {{ include "kvm-orchestrator.fullname" . }}-config
            - secretRef:
                name: {{ include "kvm-orchestrator.fullname" . }}-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
{{- end }}

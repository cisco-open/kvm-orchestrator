{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    {{- include "kvm-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    {{- include "kvm-orchestrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
{{- end }}

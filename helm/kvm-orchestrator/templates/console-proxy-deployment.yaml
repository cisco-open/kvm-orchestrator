apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvm-orchestrator.fullname" . }}-console-proxy
  labels:
    {{- include "kvm-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-proxy
spec:
  replicas: {{ .Values.replicaCount.consoleProxy }}
  selector:
    matchLabels:
      {{- include "kvm-orchestrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console-proxy
  template:
    metadata:
      labels:
        {{- include "kvm-orchestrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console-proxy
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console-proxy
          image: "{{ .Values.image.consoleProxy.repository }}:{{ .Values.image.consoleProxy.tag }}"
          imagePullPolicy: {{ .Values.image.consoleProxy.pullPolicy }}
          ports:
            - containerPort: 8765
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kvm-orchestrator.fullname" . }}-secrets
                  key: REDIS_URL
          resources:
            {{- toYaml .Values.resources.consoleProxy | nindent 12 }}

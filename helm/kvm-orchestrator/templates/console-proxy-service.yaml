apiVersion: v1
kind: Service
metadata:
  # Static name (see api-service.yaml for rationale). Matches Docker Compose.
  name: kvm-orchestrator-console-proxy
  labels:
    {{- include "kvm-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-proxy
spec:
  type: ClusterIP
  ports:
    - port: 8765
      targetPort: 8765
      protocol: TCP
  selector:
    {{- include "kvm-orchestrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console-proxy

# v0.35.7 — client IP from X-Forwarded-For, request IDs, useful access log.
# Only the ingress proxies are trusted: walk XFF right to left and stop at the
# first untrusted hop, so $remote_addr is the real client. The trusted CIDRs
# (set_real_ip_from) live in conf.d/00-real-ip.conf, generated at start-up by
# docker-entrypoint.sh from TRUSTED_PROXIES (default "10.42.0.0/16,127.0.0.1").
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Propagate an inbound X-Request-ID, else mint one.
# Only a sane inbound id is trusted (no spaces/quotes into logs or the API).
map $http_x_request_id $wvc_request_id {
    "~^[A-Za-z0-9._-]{1,128}$"  $http_x_request_id;
    default                     $request_id;
}

# Append the actual TCP peer (the ingress proxy), not the rewritten $remote_addr, so the
# upstream sees the true chain ($proxy_add_x_forwarded_for would duplicate the client).
map $http_x_forwarded_for $wvc_xff {
    default   "$http_x_forwarded_for, $realip_remote_addr";
    ""        $realip_remote_addr;
}

# Access log, readable like the API event log:
# [16/Nov/2026:10:41:02 +0000] 203.0.113.10 alice "GET /api/vms" 200 5123B 0.042s up=0.040 [9f1c2e4a...] "Mozilla/5.0 ..."
# user = X-WVC-User set by the API from the verified JWT ("-" for static files);
# the header is stripped before the response leaves (proxy_hide_header).
log_format wvc '[$time_local] $remote_addr $upstream_http_x_wvc_user '
               '"$request_method $uri" $status ${body_bytes_sent}B '
               '${request_time}s up=$upstream_response_time [$wvc_request_id] '
               '"$http_user_agent"';

# kubelet probes are not logged.
map $http_user_agent $wvc_loggable {
    "~^kube-probe"  0;
    default         1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log wvc if=$wvc_loggable;
    add_header X-Request-ID $wvc_request_id always;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://kvm-orchestrator-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $wvc_xff;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $wvc_request_id;
        proxy_set_header X-WVC-Via ui-nginx;
        # Internal: logged above via $upstream_http_x_wvc_user, never sent to clients.
        proxy_hide_header X-WVC-User;
        # The API echoes X-Request-ID; avoid a duplicate with add_header above.
        proxy_hide_header X-Request-ID;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # WebSocket proxy for VM console (noVNC <-> console-proxy)
    location /console-ws {
        proxy_pass http://kvm-orchestrator-console-proxy:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $wvc_xff;
        proxy_set_header X-Request-ID $wvc_request_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Never cache index.html so the browser always gets the latest JS bundle
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Request-ID $wvc_request_id always;
    }

    # Never cache runtime env config — it is regenerated per container start
    # from the ENVIRONMENT var and must not be served stale across redeploys.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Request-ID $wvc_request_id always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Request-ID $wvc_request_id always;
    }
}

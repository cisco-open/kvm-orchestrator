---
# RBAC grant for Jenkins backup pipeline.
#
# The your-ci-sa ServiceAccount lives in namespace your-ci-namespace (shared
# with the self-service Jenkins jobs). This Role + RoleBinding grants that SA
# minimum permissions in the kvmaestro namespace to read the MySQL
# StatefulSet, resolve its pod, and `kubectl exec` into it for mysqldump.
#
# Apply once:
#   kubectl apply -f database/rbac.yaml
#
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-mysqldump
  namespace: kvmaestro
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-mysqldump
  namespace: kvmaestro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-mysqldump
subjects:
  - kind: ServiceAccount
    name: your-ci-sa
    namespace: your-ci-namespace
